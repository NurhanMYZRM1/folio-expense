name: Mobile checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # Mobile lint reuses the desktop ESLint packages and configuration.
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npm run lint --prefix mobile
        env:
          CI: '1'
