name: Desktop verification
on:
  # Branch pushes are already verified through their pull request, so only
  # main runs on push. This stops every PR commit from running twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run assets
      - run: npm run bindings
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- src/bindings/generated
      - run: npm run format:check
      - run: npm run lint
      # Fails on a known high or critical vulnerability in the npm dependencies.
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run test:rust
      - run: npm run lint:rust
      - run: npm run test:driver
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Build unsigned evaluation installers
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      # Installers are large, so they are kept only for main and manual runs,
      # and only for a week. Artifact storage has a quota; a failed upload
      # must not turn an otherwise green verification red.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: folio-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7
      # Test traces are only useful for debugging a failure.
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: verification-${{ matrix.target }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
