name: Desktop verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any known vulnerability in the Rust dependency tree.
      # Informational warnings (unmaintained/unsound) are reported but do not
      # fail the build; today they come only from Tauri's Linux GTK stack,
      # which the macOS and Windows bundles do not ship.
      - run: cargo audit --file src-tauri/Cargo.lock
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run assets
      - run: npm run bindings
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- src/bindings/generated
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:rust
      - run: npm run lint:rust
      - run: npm run test:driver
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Build unsigned evaluation installers
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: test-results/
