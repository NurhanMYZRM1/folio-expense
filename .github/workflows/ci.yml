name: Checks
# Every pull request and every push to main runs the full verification on
# Linux. Linux minutes are billed at 1x, while macOS is 10x and Windows 2x, so
# the macOS/Windows installer builds live in desktop.yml and run only by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any known vulnerability in the Rust dependency tree.
      # Informational warnings (unmaintained/unsound) are reported but do not
      # fail the build; today they come only from Tauri's Linux GTK stack,
      # which the macOS and Windows bundles do not ship.
      - run: cargo audit --file src-tauri/Cargo.lock
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux system libraries, needed to compile the desktop app for
      # clippy (`npm run lint:rust`).
      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run assets
      - run: npm run bindings
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- src/bindings/generated
      - run: npm run format:check
      - run: npm run lint
      # Fails on a known high or critical vulnerability in the npm dependencies.
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run test:rust
      - run: npm run lint:rust
      - run: npm run test:driver
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Test traces are only useful for debugging a failure.
      - uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: verification-linux
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
