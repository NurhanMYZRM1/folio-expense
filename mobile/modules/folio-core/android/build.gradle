plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.foliocore'
version = '0.1.0'

android {
  namespace "expo.modules.foliocore"
  defaultConfig {
    consumerProguardFiles 'consumer-rules.pro'
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled model: receipt OCR works without a first-use network download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
